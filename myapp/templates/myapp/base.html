{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Mysite{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'myapp/css/style.css' %}">
</head>
<body>

<input type="checkbox" id="nav-toggle">

<label for="nav-toggle" class="overlay"></label>

<aside class="sidebar">
    <div class="sidebar-header">
        <h2>MyApp</h2>
    </div>
    {% load navigation %}
    <nav class="nav-links">
        <a href="{% url 'home' %}">Главная</a>
        <a href="{% url 'task' %}">Задача</a>
        <a href="{% url 'classmates' %}">Образовательная программа</a>
        <a href ="{% url 'reviews' %}">Лист отзывов</a>
        {% show_nav_pages %}
        <a href="https://github.com/IlshatKhtpv/django-mysite">GitHub</a>
    </nav>
</aside>

<label for="nav-toggle" class="menu-btn">
    ☰
</label>

<main class="page-wrapper">
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
